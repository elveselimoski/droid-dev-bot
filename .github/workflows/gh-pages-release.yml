name: Release in GitHub repository

on:
  workflow_dispatch:

  push:
    branches: [ develop ]

jobs:

  release-github:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Create plugin directory
        run: |
          mkdir -p plugin-repository
          cp build/distributions/*.zip plugin-repository/
        # cp updatePlugins.xml plugin-repository/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./plugin-repository
          publish_branch: gh-pages
          force_orphan: true