name: Release in GitHub repository

on:
  workflow_dispatch:

  workflow_run:
    workflows: ['Build']
    types:
      - completed

jobs:

  release-github:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      - name: Update uploadPlugins.xml file
        uses: elveselimoski/intellij-update-plugins-xml-action@v0.1.0
        with:
          version: "0.1.0"
          url: "https://www.test.com/plugin.zip"
      
      - name: List files in the distributions
        run: |
          ls -la build/distributions

